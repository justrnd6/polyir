<svg viewBox="0 0 700 246" width="100%" role="img" aria-label="Three names for one darray, before and after a push">
<defs><marker id="rf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#586069"/></marker></defs>
<text x="10" y="20" font-size="12" font-weight="700" fill="#1b1f24">three names, one darray</text>
<rect x="10" y="46" width="62" height="26" rx="4" fill="#eef5fc" stroke="#0b5cad"/><text x="41" y="63" font-size="11" text-anchor="middle" fill="#1b1f24">a</text>
<path d="M72 59 L114 84" stroke="#586069" stroke-width="1.3" fill="none" marker-end="url(#rf)"/>
<rect x="10" y="84" width="62" height="26" rx="4" fill="#eef5fc" stroke="#0b5cad"/><text x="41" y="101" font-size="11" text-anchor="middle" fill="#1b1f24">b</text>
<path d="M72 97 L114 96" stroke="#586069" stroke-width="1.3" fill="none" marker-end="url(#rf)"/>
<rect x="10" y="122" width="62" height="26" rx="4" fill="#eef5fc" stroke="#0b5cad"/><text x="41" y="139" font-size="11" text-anchor="middle" fill="#1b1f24">bag.items</text>
<path d="M72 135 L114 108" stroke="#586069" stroke-width="1.3" fill="none" marker-end="url(#rf)"/>
<text x="118" y="46" font-size="10" fill="#586069">header on the heap</text>
<rect x="118" y="58" width="86" height="26" fill="#f6f8fa" stroke="#586069"/><text x="124" y="75" font-size="11" fill="#1b1f24">data</text><text x="198" y="75" font-size="11" font-weight="700" text-anchor="end" fill="#1b1f24">&#8594;</text>
<rect x="118" y="84" width="86" height="26" fill="#f6f8fa" stroke="#586069"/><text x="124" y="101" font-size="11" fill="#1b1f24">length</text><text x="198" y="101" font-size="11" font-weight="700" text-anchor="end" fill="#1b1f24">3</text>
<rect x="118" y="110" width="86" height="26" fill="#f6f8fa" stroke="#586069"/><text x="124" y="127" font-size="11" fill="#1b1f24">capacity</text><text x="198" y="127" font-size="11" font-weight="700" text-anchor="end" fill="#1b1f24">3</text>
<text x="234" y="46" font-size="10" fill="#586069">the elements</text>
<path d="M204 71 L232 71" stroke="#586069" stroke-width="1.3" fill="none" marker-end="url(#rf)"/>
<rect x="234" y="58" width="24" height="26" fill="#f6f8fa" stroke="#586069"/><text x="246" y="75" font-size="11" text-anchor="middle" fill="#1b1f24">5</text>
<rect x="258" y="58" width="24" height="26" fill="#f6f8fa" stroke="#586069"/><text x="270" y="75" font-size="11" text-anchor="middle" fill="#1b1f24">6</text>
<rect x="282" y="58" width="24" height="26" fill="#f6f8fa" stroke="#586069"/><text x="294" y="75" font-size="11" text-anchor="middle" fill="#1b1f24">9</text>
<text x="10" y="176" font-size="11" fill="#1b1f24">a, b and bag.items hold the same pointer.</text><text x="10" y="192" font-size="11" fill="#586069">There is only one header and one list of elements.</text>
<text x="360" y="20" font-size="12" font-weight="700" fill="#1b1f24">after push(b, 7)</text>
<rect x="360" y="46" width="62" height="26" rx="4" fill="#eef5fc" stroke="#0b5cad"/><text x="391" y="63" font-size="11" text-anchor="middle" fill="#1b1f24">a</text>
<path d="M422 59 L464 84" stroke="#586069" stroke-width="1.3" fill="none" marker-end="url(#rf)"/>
<rect x="360" y="84" width="62" height="26" rx="4" fill="#eef5fc" stroke="#0b5cad"/><text x="391" y="101" font-size="11" text-anchor="middle" fill="#1b1f24">b</text>
<path d="M422 97 L464 96" stroke="#586069" stroke-width="1.3" fill="none" marker-end="url(#rf)"/>
<rect x="360" y="122" width="62" height="26" rx="4" fill="#eef5fc" stroke="#0b5cad"/><text x="391" y="139" font-size="11" text-anchor="middle" fill="#1b1f24">bag.items</text>
<path d="M422 135 L464 108" stroke="#586069" stroke-width="1.3" fill="none" marker-end="url(#rf)"/>
<text x="468" y="46" font-size="10" fill="#586069">header on the heap</text>
<rect x="468" y="58" width="86" height="26" fill="#fff4d6" stroke="#9a6700"/><text x="474" y="75" font-size="11" fill="#1b1f24">data</text><text x="548" y="75" font-size="11" font-weight="700" text-anchor="end" fill="#1b1f24">&#8594;</text>
<rect x="468" y="84" width="86" height="26" fill="#fff4d6" stroke="#9a6700"/><text x="474" y="101" font-size="11" fill="#1b1f24">length</text><text x="548" y="101" font-size="11" font-weight="700" text-anchor="end" fill="#1b1f24">4</text>
<rect x="468" y="110" width="86" height="26" fill="#fff4d6" stroke="#9a6700"/><text x="474" y="127" font-size="11" fill="#1b1f24">capacity</text><text x="548" y="127" font-size="11" font-weight="700" text-anchor="end" fill="#1b1f24">4</text>
<text x="584" y="46" font-size="10" fill="#586069">the elements</text>
<path d="M554 71 L582 71" stroke="#586069" stroke-width="1.3" fill="none" marker-end="url(#rf)"/>
<rect x="584" y="58" width="24" height="26" fill="#f6f8fa" stroke="#586069"/><text x="596" y="75" font-size="11" text-anchor="middle" fill="#1b1f24">5</text>
<rect x="608" y="58" width="24" height="26" fill="#f6f8fa" stroke="#586069"/><text x="620" y="75" font-size="11" text-anchor="middle" fill="#1b1f24">6</text>
<rect x="632" y="58" width="24" height="26" fill="#f6f8fa" stroke="#586069"/><text x="644" y="75" font-size="11" text-anchor="middle" fill="#1b1f24">9</text>
<rect x="656" y="58" width="24" height="26" fill="#d9f0dc" stroke="#1b7f3b"/><text x="668" y="75" font-size="11" text-anchor="middle" fill="#1b1f24">7</text>
<text x="360" y="176" font-size="11" fill="#1b1f24">The push changed the header (and moved the elements).</text><text x="360" y="192" font-size="11" fill="#586069">a and bag.items see length 4 as well.</text>
<text x="10" y="222" font-size="11" fill="#586069">A darray, sparse or hashmap is this pointer. Copying it, passing it or storing it copies the pointer,</text>
<text x="10" y="238" font-size="11" fill="#586069">never the elements; a + b is the way to make a new list.</text>
</svg>