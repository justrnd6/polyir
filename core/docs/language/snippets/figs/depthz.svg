<svg viewBox="0 0 700 320" width="100%" role="img" aria-label="Depth and the z coordinate, seen from above">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586069"/></marker></defs>
<polygon points="350,270 180,30 520,30" fill="#eef5fc" stroke="none"/>
<g transform="translate(350,270) rotate(-90) scale(1.00)">
<rect x="-14" y="-9" width="28" height="18" rx="3" fill="#eef5fc" stroke="#0b5cad" stroke-width="1.4"/>
<polygon points="14,-6 24,-11 24,11 14,6" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.4"/>
</g>
<text x="350" y="300" font-size="11" text-anchor="middle" fill="#586069">camera at z = 0</text>
<line x1="150" y1="270" x2="550" y2="270" stroke="#d0d7de" stroke-dasharray="4 3"/>
<text x="140" y="274" font-size="12" text-anchor="end" fill="#1b1f24">z = 0</text>
<text x="560" y="274" font-size="12" fill="#1b1f24">depth = 0</text>
<line x1="150" y1="170" x2="550" y2="170" stroke="#d0d7de" stroke-dasharray="4 3"/>
<text x="140" y="174" font-size="12" text-anchor="end" fill="#1b1f24">z = &minus;5</text>
<text x="560" y="174" font-size="12" fill="#1b1f24">depth = 5</text>
<line x1="150" y1="70" x2="550" y2="70" stroke="#d0d7de" stroke-dasharray="4 3"/>
<text x="140" y="74" font-size="12" text-anchor="end" fill="#1b1f24">z = &minus;10</text>
<text x="560" y="74" font-size="12" fill="#1b1f24">depth = 10</text>
<circle cx="350" cy="170" r="7" fill="#d73a49"/>
<text x="364" y="174" font-size="11" fill="#586069">toy B</text>
<circle cx="350" cy="70" r="7" fill="#d73a49"/>
<text x="364" y="74" font-size="11" fill="#586069">toy A</text>
<line x1="40" y1="60" x2="40" y2="260" stroke="#0b5cad" stroke-width="2" marker-end="url(#arr)"/>
<text x="40" y="276" font-size="11" text-anchor="middle" fill="#0b5cad">z grows</text>
<text x="40" y="290" font-size="11" text-anchor="middle" fill="#0b5cad">(toward you)</text>
<line x1="660" y1="260" x2="660" y2="60" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr)"/>
<text x="660" y="276" font-size="11" text-anchor="middle" fill="#1a7f37">depth grows</text>
<text x="660" y="290" font-size="11" text-anchor="middle" fill="#1a7f37">(away from you)</text>
<text x="20" y="18" font-size="12" font-weight="700" fill="#1b1f24">Right-handed room: the camera looks toward smaller z, so depth = camera z &minus; point z</text>
</svg>