<svg viewBox="0 0 700 250" width="100%" role="img" aria-label="One ray from the eye, many things that fit it">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586069"/></marker></defs>
<line x1="60" y1="150" x2="680" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="60" cy="150" r="5" fill="#0b5cad"/>
<text x="60" y="176" font-size="11" text-anchor="middle" fill="#586069">the eye</text>
<line x1="200" y1="90" x2="200" y2="210" stroke="#0b5cad" stroke-width="2"/>
<text x="200" y="228" font-size="11" text-anchor="middle" fill="#0b5cad">the window</text>
<line x1="60" y1="150" x2="610" y2="95" stroke="#9a6700" stroke-width="1.2"/>
<circle cx="200" cy="136" r="4" fill="#0b5cad"/>
<line x1="300" y1="150" x2="300" y2="130" stroke="#d73a49" stroke-width="3" marker-end="url(#arr)"/>
<text x="300" y="176" font-size="11" text-anchor="middle" fill="#586069">near and small</text>
<text x="300" y="190" font-size="11" text-anchor="middle" fill="#586069">0.9 m at 10 m</text>
<line x1="450" y1="150" x2="450" y2="115" stroke="#d73a49" stroke-width="3" marker-end="url(#arr)"/>
<text x="450" y="176" font-size="11" text-anchor="middle" fill="#586069">middle</text>
<text x="450" y="190" font-size="11" text-anchor="middle" fill="#586069">1.35 m at 15 m</text>
<line x1="600" y1="150" x2="600" y2="100" stroke="#d73a49" stroke-width="3" marker-end="url(#arr)"/>
<text x="600" y="176" font-size="11" text-anchor="middle" fill="#586069">far and big</text>
<text x="600" y="190" font-size="11" text-anchor="middle" fill="#586069">1.8 m at 20 m</text>
<text x="20" y="18" font-size="12" font-weight="700" fill="#1b1f24">Three different people, one identical picture</text>
<text x="20" y="38" font-size="11" fill="#586069">All three tops lie on the same ray, so they hit the same spot of the window. A single eye cannot tell them apart.</text>
<text x="20" y="56" font-size="11" fill="#586069">What the picture holds is the direction of each ray, not the distance along it.</text>
</svg>