<svg viewBox="0 0 700 300" width="100%" role="img" aria-label="An Apple M-series chip shares one memory; a PC with a graphics card has two">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586069"/></marker></defs>
<text x="20" y="18" font-size="12" font-weight="700" fill="#1b1f24">Apple M-series: one chip, one pool of memory</text>
<rect x="20" y="28" width="320" height="170" rx="8" fill="#f6f8fa" stroke="#586069"/>
<text x="30" y="46" font-size="10" fill="#586069">system on a chip</text>
<rect x="34" y="54" width="90" height="44" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="79.0" y="73.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">CPU cores</text>
<text x="79.0" y="87.0" font-size="10" text-anchor="middle" fill="#1b1f24">fast + efficient</text>
<rect x="134" y="54" width="90" height="44" rx="5" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="179.0" y="73.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">GPU cores</text>
<text x="179.0" y="87.0" font-size="10" text-anchor="middle" fill="#1b1f24">your kernels</text>
<rect x="234" y="54" width="92" height="44" rx="5" fill="#fff8e6" stroke="#9a6700"/>
<text x="280.0" y="73.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Neural Engine</text>
<text x="280.0" y="87.0" font-size="10" text-anchor="middle" fill="#1b1f24">media engines</text>
<rect x="34" y="130" width="292" height="40" rx="5" fill="#fdf2f2" stroke="#d73a49"/>
<text x="180.0" y="154.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1f24">unified memory (one pool)</text>
<line x1="79" y1="98" x2="79" y2="130" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="179" y1="98" x2="179" y2="130" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="280" y1="98" x2="280" y2="130" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="30" y="190" font-size="10" fill="#586069">everything reads and writes the same bytes: no copy needed</text>
<text x="360" y="18" font-size="12" font-weight="700" fill="#1b1f24">PC with a separate graphics card: two pools</text>
<rect x="370" y="54" width="90" height="44" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="415.0" y="73.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">CPU</text>
<text x="415.0" y="87.0" font-size="10" text-anchor="middle" fill="#1b1f24">+ main memory</text>
<rect x="590" y="54" width="90" height="44" rx="5" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="635.0" y="73.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">GPU</text>
<text x="635.0" y="87.0" font-size="10" text-anchor="middle" fill="#1b1f24">+ its own memory</text>
<rect x="370" y="130" width="90" height="40" rx="5" fill="#fdf2f2" stroke="#d73a49"/>
<text x="415.0" y="154.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1f24">RAM</text>
<rect x="590" y="130" width="90" height="40" rx="5" fill="#fdf2f2" stroke="#d73a49"/>
<text x="635.0" y="154.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1f24">VRAM</text>
<line x1="415" y1="98" x2="415" y2="130" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="635" y1="98" x2="635" y2="130" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="460" y1="150" x2="590" y2="150" stroke="#9a6700" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr)"/>
<text x="525" y="144" font-size="10" text-anchor="middle" fill="#9a6700">bus: data is copied</text>
<text x="360" y="190" font-size="10" fill="#586069">inputs are copied across before the kernel; results copied back after</text>
<text x="20" y="232" font-size="11" fill="#586069">This is why the Metal calls in this guide can read results straight out of a buffer. A kernel still has to be started by a command</text>
<text x="20" y="248" font-size="11" fill="#586069">(section 5.6), but the data is already where both sides can see it. The speed of that shared memory still limits memory-bound kernels.</text>
</svg>