<svg viewBox="0 0 700 280" width="100%" role="img" aria-label="The camera moves of a film crew">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586069"/></marker></defs>
<text x="20" y="18" font-size="12" font-weight="700" fill="#1b1f24">From above</text>
<g transform="translate(100,170) rotate(-90) scale(1.10)">
<rect x="-14" y="-9" width="28" height="18" rx="3" fill="#eef5fc" stroke="#0b5cad" stroke-width="1.4"/>
<polygon points="14,-6 24,-11 24,11 14,6" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.4"/>
</g>
<line x1="100" y1="140" x2="100" y2="60" stroke="#d73a49" stroke-width="2" marker-end="url(#arr)"/>
<line x1="100" y1="200" x2="100" y2="240" stroke="#d73a49" stroke-width="2" marker-end="url(#arr)"/>
<text x="108" y="64" font-size="10" fill="#d73a49">dolly in</text>
<text x="108" y="246" font-size="10" fill="#d73a49">dolly out</text>
<line x1="70" y1="170" x2="20" y2="170" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr)"/>
<line x1="130" y1="170" x2="180" y2="170" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr)"/>
<text x="20" y="188" font-size="10" fill="#1a7f37">truck left</text>
<text x="132" y="188" font-size="10" fill="#1a7f37">truck right</text>
<path d="M 72 124 A 40 40 0 0 1 128 124" fill="none" stroke="#9a6700" stroke-width="2" marker-end="url(#arr)"/>
<text x="136" y="112" font-size="10" fill="#9a6700">pan</text>
<text x="250" y="18" font-size="12" font-weight="700" fill="#1b1f24">From the side</text>
<g transform="translate(330,150) rotate(0) scale(1.10)">
<rect x="-14" y="-9" width="28" height="18" rx="3" fill="#eef5fc" stroke="#0b5cad" stroke-width="1.4"/>
<polygon points="14,-6 24,-11 24,11 14,6" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.4"/>
</g>
<line x1="330" y1="125" x2="330" y2="60" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr)"/>
<line x1="330" y1="175" x2="330" y2="235" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr)"/>
<text x="338" y="68" font-size="10" fill="#1a7f37">pedestal up (boom)</text>
<text x="338" y="232" font-size="10" fill="#1a7f37">pedestal down</text>
<path d="M 372 120 A 50 50 0 0 0 372 180" fill="none" stroke="#9a6700" stroke-width="2" marker-end="url(#arr)"/>
<text x="382" y="154" font-size="10" fill="#9a6700">tilt</text>
<text x="500" y="18" font-size="12" font-weight="700" fill="#1b1f24">From behind the camera</text>
<rect x="560" y="120" width="60" height="45" rx="3" fill="#eef5fc" stroke="#0b5cad" stroke-width="1.4"/>
<circle cx="590" cy="142" r="12" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.4"/>
<path d="M 545 118 A 55 55 0 0 1 635 118" fill="none" stroke="#9a6700" stroke-width="2" marker-end="url(#arr)"/>
<text x="590" y="74" font-size="10" text-anchor="middle" fill="#9a6700">roll (a tilted horizon,</text>
<text x="590" y="88" font-size="10" text-anchor="middle" fill="#9a6700">the "Dutch angle")</text>
<text x="500" y="200" font-size="11" fill="#586069">Zoom is not a move: the camera stays</text>
<text x="500" y="214" font-size="11" fill="#586069">where it is and the LENS changes.</text>
<text x="20" y="272" font-size="10" fill="#586069">Red: along the camera&#39;s forward axis. Green: along its other two axes. Gold: turning about an axis.</text>
</svg>