<svg viewBox="0 0 700 260" width="100%" role="img" aria-label="Interlaced scanning of a television picture">
<rect x="20" y="30" width="300" height="200" fill="#f6f8fa" stroke="#c9d1d9"/>
<text x="170" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#1b1f24">the beam draws the picture as lines</text>
<line x1="26" y1="40" x2="314" y2="44" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="50" x2="314" y2="54" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="314" y1="44" x2="26" y2="50" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="1 3"/>
<line x1="26" y1="60" x2="314" y2="64" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="70" x2="314" y2="74" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="314" y1="64" x2="26" y2="70" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="1 3"/>
<line x1="26" y1="80" x2="314" y2="84" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="90" x2="314" y2="94" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="314" y1="84" x2="26" y2="90" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="1 3"/>
<line x1="26" y1="100" x2="314" y2="104" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="110" x2="314" y2="114" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="314" y1="104" x2="26" y2="110" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="1 3"/>
<line x1="26" y1="120" x2="314" y2="124" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="130" x2="314" y2="134" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="26" y1="140" x2="314" y2="144" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="150" x2="314" y2="154" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="26" y1="160" x2="314" y2="164" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="170" x2="314" y2="174" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="26" y1="180" x2="314" y2="184" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="190" x2="314" y2="194" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="26" y1="200" x2="314" y2="204" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="210" x2="314" y2="214" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="26" y1="220" x2="314" y2="224" stroke="#0366d6" stroke-width="1.6"/>
<line x1="26" y1="230" x2="314" y2="234" stroke="#d73a49" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="340" y="60" font-size="12" font-weight="700" fill="#0366d6">solid blue: field 1 (lines 1, 3, 5 ...)</text>
<text x="340" y="82" font-size="12" font-weight="700" fill="#d73a49">dashed red: field 2 (lines 2, 4, 6 ...)</text>
<text x="340" y="108" font-size="12" fill="#586069">grey dotted: the beam snaps back to the left</text>
<text x="340" y="124" font-size="12" fill="#586069">(horizontal retrace, while the signal is blanked).</text>
<text x="340" y="150" font-size="12" fill="#586069">525 lines in all, drawn as two interleaved fields:</text>
<text x="340" y="166" font-size="12" fill="#586069">60 fields a second, so 30 whole pictures a second.</text>
<text x="340" y="192" font-size="12" fill="#586069">Interlacing refreshes the screen 60 times a second,</text>
<text x="340" y="208" font-size="12" fill="#586069">which the eye sees as steady, for the bandwidth of 30.</text>
<text x="340" y="232" font-size="11" fill="#586069">(10 lines per field are drawn here; a real field has about 262.)</text>
</svg>