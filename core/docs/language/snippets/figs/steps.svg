<svg viewBox="0 0 700 230" width="100%" role="img" aria-label="The four steps from a point in the world to a pixel, with the numbers of the worked example">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586069"/></marker></defs>
<rect x="10" y="30" width="120" height="62" rx="5" fill="#f6f8fa" stroke="#586069"/>
<text x="70.0" y="65.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">a point in the world</text>
<text x="70" y="82" font-size="10" text-anchor="middle" fill="#1b1f24">(2, 1, -10)</text>
<rect x="150" y="30" width="120" height="62" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="210.0" y="65.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">relative to the camera</text>
<text x="210" y="82" font-size="10" text-anchor="middle" fill="#1b1f24">(2, -0.5, -10)</text>
<rect x="290" y="30" width="120" height="62" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="350.0" y="65.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">in the camera's terms</text>
<text x="350" y="82" font-size="10" text-anchor="middle" fill="#1b1f24">right 2, above -0.5, ahead 10</text>
<rect x="430" y="30" width="120" height="62" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="490.0" y="65.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">on the picture plane</text>
<text x="490" y="82" font-size="10" text-anchor="middle" fill="#1b1f24">(0.195, -0.087)</text>
<rect x="570" y="30" width="120" height="62" rx="5" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="630.0" y="65.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">a pixel</text>
<text x="630" y="82" font-size="10" text-anchor="middle" fill="#1b1f24">(1147.1, 586.8)</text>
<line x1="130" y1="61" x2="150" y2="61" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="270" y1="61" x2="290" y2="61" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="410" y1="61" x2="430" y2="61" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="550" y1="61" x2="570" y2="61" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="140" y="115" font-size="10" text-anchor="middle" font-weight="700" fill="#0b5cad">step 1</text>
<text x="140" y="132" font-size="10" text-anchor="middle" fill="#1b1f24">subtract the camera's</text>
<text x="140" y="146" font-size="10" text-anchor="middle" fill="#1b1f24">position (walk to it)</text>
<text x="280" y="115" font-size="10" text-anchor="middle" font-weight="700" fill="#0b5cad">step 2</text>
<text x="280" y="132" font-size="10" text-anchor="middle" fill="#1b1f24">dot products with its</text>
<text x="280" y="146" font-size="10" text-anchor="middle" fill="#1b1f24">right, up and forward</text>
<text x="420" y="115" font-size="10" text-anchor="middle" font-weight="700" fill="#0b5cad">step 3</text>
<text x="420" y="132" font-size="10" text-anchor="middle" fill="#1b1f24">divide by ahead and</text>
<text x="420" y="146" font-size="10" text-anchor="middle" fill="#1b1f24">by the lens: far = small</text>
<text x="560" y="115" font-size="10" text-anchor="middle" font-weight="700" fill="#0b5cad">step 4</text>
<text x="560" y="132" font-size="10" text-anchor="middle" fill="#1b1f24">scale to pixels;</text>
<text x="560" y="146" font-size="10" text-anchor="middle" fill="#1b1f24">row 0 is the top</text>
<text x="20" y="190" font-size="11" fill="#586069">The point (2, 1, -10) is seen by a camera at (0, 1.5, 0) looking down -z, with a 60 degree lens, on a 1920 x 1080 picture.</text>
<text x="20" y="206" font-size="11" fill="#586069">Step 4 gives column 1147 (a little right of the middle, 960) and row 587 (a little below the middle, 540).</text>
</svg>