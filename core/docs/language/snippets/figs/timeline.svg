<svg viewBox="0 0 700 295" width="100%" role="img" aria-label="The CPU and the GPU working on a job, with and without waiting">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586069"/></marker></defs>
<text x="80" y="16" font-size="12" font-weight="700" fill="#1b1f24">A. What the polyir runtimes do: send a job, then wait for it</text>
<text x="12" y="46" font-size="12" font-weight="700" fill="#1b1f24">CPU</text>
<line x1="80" y1="54" x2="690" y2="54" stroke="#e1e4e8"/>
<text x="12" y="86" font-size="12" font-weight="700" fill="#1b1f24">GPU</text>
<line x1="80" y1="94" x2="690" y2="94" stroke="#e1e4e8"/>
<rect x="80" y="28" width="90" height="28" rx="4" fill="#eef5fc" stroke="#0b5cad"/>
<text x="125" y="46" font-size="10" text-anchor="middle" fill="#1b1f24">write job 1</text>
<rect x="170" y="28" width="60" height="28" rx="4" fill="#fff8e6" stroke="#9a6700"/>
<text x="200" y="46" font-size="10" text-anchor="middle" fill="#1b1f24">wait</text>
<rect x="230" y="28" width="60" height="28" rx="4" fill="#eef5fc" stroke="#0b5cad"/>
<text x="260" y="46" font-size="10" text-anchor="middle" fill="#1b1f24">read</text>
<rect x="290" y="28" width="90" height="28" rx="4" fill="#eef5fc" stroke="#0b5cad"/>
<text x="335" y="46" font-size="10" text-anchor="middle" fill="#1b1f24">write job 2</text>
<rect x="380" y="28" width="60" height="28" rx="4" fill="#fff8e6" stroke="#9a6700"/>
<text x="410" y="46" font-size="10" text-anchor="middle" fill="#1b1f24">wait</text>
<rect x="440" y="28" width="60" height="28" rx="4" fill="#eef5fc" stroke="#0b5cad"/>
<text x="470" y="46" font-size="10" text-anchor="middle" fill="#1b1f24">read</text>
<rect x="170" y="68" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="200" y="86" font-size="10" text-anchor="middle" fill="#1b1f24">run 1</text>
<rect x="380" y="68" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="410" y="86" font-size="10" text-anchor="middle" fill="#1b1f24">run 2</text>
<line x1="170" y1="56" x2="175" y2="68" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="380" y1="56" x2="385" y2="68" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="80" y="140" font-size="12" font-weight="700" fill="#1b1f24">B. What real engines do: keep both busy (the GPU runs job 1 while the CPU writes job 2)</text>
<text x="12" y="170" font-size="12" font-weight="700" fill="#1b1f24">CPU</text>
<line x1="80" y1="178" x2="690" y2="178" stroke="#e1e4e8"/>
<text x="12" y="210" font-size="12" font-weight="700" fill="#1b1f24">GPU</text>
<line x1="80" y1="218" x2="690" y2="218" stroke="#e1e4e8"/>
<rect x="80" y="152" width="90" height="28" rx="4" fill="#eef5fc" stroke="#0b5cad"/>
<text x="125" y="170" font-size="10" text-anchor="middle" fill="#1b1f24">write job 1</text>
<rect x="170" y="152" width="90" height="28" rx="4" fill="#eef5fc" stroke="#0b5cad"/>
<text x="215" y="170" font-size="10" text-anchor="middle" fill="#1b1f24">write job 2</text>
<rect x="260" y="152" width="90" height="28" rx="4" fill="#eef5fc" stroke="#0b5cad"/>
<text x="305" y="170" font-size="10" text-anchor="middle" fill="#1b1f24">write job 3</text>
<rect x="350" y="152" width="60" height="28" rx="4" fill="#eef5fc" stroke="#0b5cad"/>
<text x="380" y="170" font-size="10" text-anchor="middle" fill="#1b1f24">read 1</text>
<rect x="170" y="192" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="215" y="210" font-size="10" text-anchor="middle" fill="#1b1f24">run 1</text>
<rect x="260" y="192" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="305" y="210" font-size="10" text-anchor="middle" fill="#1b1f24">run 2</text>
<rect x="350" y="192" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="395" y="210" font-size="10" text-anchor="middle" fill="#1b1f24">run 3</text>
<line x1="170" y1="180" x2="175" y2="192" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="80" y="250" font-size="11" fill="#586069">Time runs to the right. In A the CPU idles while the GPU works, and the GPU idles while the CPU writes.</text>
<text x="80" y="266" font-size="11" fill="#586069">In B the work overlaps, so the total is shorter. The price of B is that the CPU must keep track of</text>
<text x="80" y="282" font-size="11" fill="#586069">which job has finished before it reads or reuses anything.</text>
</svg>