<svg viewBox="0 0 700 330" width="100%" role="img" aria-label="The camera seen from above: right, ahead and the field of view">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586069"/></marker></defs>
<polygon points="300,290 165,40 435,40" fill="#eef5fc" stroke="none"/>
<line x1="300" y1="290" x2="165" y2="40" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="6 3"/>
<line x1="300" y1="290" x2="435" y2="40" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="6 3"/>
<line x1="300" y1="290" x2="300" y2="40" stroke="#586069" stroke-width="1" stroke-dasharray="2 4"/>
<g transform="translate(300,294) rotate(-90) scale(1.00)">
<rect x="-14" y="-9" width="28" height="18" rx="3" fill="#eef5fc" stroke="#0b5cad" stroke-width="1.4"/>
<polygon points="14,-6 24,-11 24,11 14,6" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.4"/>
</g>
<text x="300" y="320" font-size="11" text-anchor="middle" fill="#586069">the camera</text>
<text x="300" y="30" font-size="11" text-anchor="middle" fill="#0b5cad">what it can see (the field of view)</text>
<circle cx="400" cy="120" r="6" fill="#d73a49"/>
<text x="410" y="124" font-size="12" font-weight="700" fill="#d73a49">P</text>
<line x1="300" y1="120" x2="392" y2="120" stroke="#d73a49" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="350" y="114" font-size="11" text-anchor="middle" fill="#d73a49">right</text>
<line x1="288" y1="270" x2="288" y2="124" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="270" y="205" font-size="11" text-anchor="end" fill="#1a7f37">ahead (the distance in front)</text>
<line x1="300" y1="290" x2="400" y2="120" stroke="#9a6700" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="260" y1="250" x2="340" y2="250" stroke="#0b5cad" stroke-width="2.5"/>
<text x="346" y="254" font-size="10" fill="#0b5cad">picture plane</text>
<text x="470" y="52" font-size="11" fill="#586069">Seen from above, with the camera at the</text>
<text x="470" y="68" font-size="11" fill="#586069">bottom looking up the page. The dashed</text>
<text x="470" y="84" font-size="11" fill="#586069">blue lines are the edges of what it sees;</text>
<text x="470" y="100" font-size="11" fill="#586069">each makes half the field of view with</text>
<text x="470" y="116" font-size="11" fill="#586069">the dotted middle line.</text>
<text x="470" y="160" font-size="11" fill="#d73a49">right: how far to its right P is (x)</text>
<text x="470" y="180" font-size="11" fill="#1a7f37">ahead: how far in front of it P is (depth)</text>
<text x="470" y="220" font-size="11" fill="#586069">Drawn from the side, the same picture would</text>
<text x="470" y="236" font-size="11" fill="#586069">show "above" (y) against "ahead" in just the</text>
<text x="470" y="252" font-size="11" fill="#586069">same way: three numbers, three directions.</text>
<text x="20" y="324" font-size="10" fill="#586069">Not to scale.</text>
</svg>