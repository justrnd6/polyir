<svg viewBox="0 0 700 270" width="100%" role="img" aria-label="Pan (yaw) seen from above and tilt (pitch) seen from the side">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586069"/></marker></defs>
<text x="20" y="18" font-size="12" font-weight="700" fill="#1b1f24">A pan, from above: the camera turns on the spot</text>
<line x1="130" y1="185" x2="130" y2="62" stroke="#586069" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="130" y="52" font-size="10" text-anchor="middle" fill="#586069">yaw 0: looks along -z (the back wall)</text>
<line x1="130" y1="205" x2="216" y2="82" stroke="#9a6700" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M 130 135 A 70 70 0 0 1 170 148" fill="none" stroke="#9a6700" stroke-width="1.4"/>
<text x="196" y="74" font-size="10" fill="#9a6700">yaw +35&#176;: now looks toward +x</text>
<g transform="translate(130,205) rotate(-55) scale(1.10)">
<rect x="-14" y="-9" width="28" height="18" rx="3" fill="#eef5fc" stroke="#0b5cad" stroke-width="1.4"/>
<polygon points="14,-6 24,-11 24,11 14,6" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.4"/>
</g>
<text x="130" y="239" font-size="10" text-anchor="middle" fill="#586069">the camera does not move,</text>
<text x="130" y="252" font-size="10" text-anchor="middle" fill="#586069">it only swings round</text>
<line x1="250" y1="240" x2="300" y2="240" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr)"/>
<text x="306" y="244" font-size="10" fill="#1a7f37">+x (right)</text>
<text x="380" y="18" font-size="12" font-weight="700" fill="#1b1f24">A tilt, from the side: the camera nods</text>
<line x1="380" y1="210" x2="680" y2="210" stroke="#d0d7de" stroke-dasharray="3 3"/>
<line x1="450" y1="190" x2="620" y2="190" stroke="#586069" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="665" y="204" font-size="10" text-anchor="end" fill="#586069">pitch 0: level, at the horizon</text>
<line x1="430" y1="190" x2="560" y2="115" stroke="#9a6700" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M 510 190 A 80 80 0 0 0 499 150" fill="none" stroke="#9a6700" stroke-width="1.4"/>
<text x="500" y="107" font-size="10" fill="#9a6700">pitch +30&#176;: looks up</text>
<g transform="translate(430,190) rotate(-30) scale(1.10)">
<rect x="-14" y="-9" width="28" height="18" rx="3" fill="#eef5fc" stroke="#0b5cad" stroke-width="1.4"/>
<polygon points="14,-6 24,-11 24,11 14,6" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.4"/>
</g>
<line x1="660" y1="250" x2="660" y2="215" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr)"/>
<text x="650" y="240" font-size="10" text-anchor="end" fill="#1a7f37">+y (up)</text>
</svg>