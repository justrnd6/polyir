<svg viewBox="0 0 700 300" width="100%" role="img" aria-label="The Vulkan objects a compute launch needs, and what makes what">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586069"/></marker></defs>
<rect x="20" y="20" width="110" height="40" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="75.0" y="37.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Instance</text>
<text x="75.0" y="51.0" font-size="10" text-anchor="middle" fill="#1b1f24">vulkanInstance</text>
<rect x="160" y="20" width="130" height="40" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="225.0" y="37.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Physical device</text>
<text x="225.0" y="51.0" font-size="10" text-anchor="middle" fill="#1b1f24">the GPU itself</text>
<rect x="320" y="20" width="130" height="40" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="385.0" y="37.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Logical device</text>
<text x="385.0" y="51.0" font-size="10" text-anchor="middle" fill="#1b1f24">your handle to it</text>
<rect x="480" y="20" width="100" height="40" rx="5" fill="#fff8e6" stroke="#9a6700"/>
<text x="530.0" y="37.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Queue</text>
<text x="530.0" y="51.0" font-size="10" text-anchor="middle" fill="#1b1f24">the in-tray</text>
<rect x="600" y="20" width="80" height="40" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="640.0" y="37.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Command</text>
<text x="640.0" y="51.0" font-size="10" text-anchor="middle" fill="#1b1f24">pool</text>
<line x1="130" y1="40" x2="160" y2="40" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="290" y1="40" x2="320" y2="40" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="450" y1="40" x2="480" y2="40" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="580" y1="40" x2="600" y2="40" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="20" y="92" font-size="11" fill="#586069">Set up once per program (vulkanStart)</text>
<rect x="20" y="110" width="130" height="44" rx="5" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="85.0" y="129.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Buffer</text>
<text x="85.0" y="143.0" font-size="10" text-anchor="middle" fill="#1b1f24">the array's handle</text>
<rect x="20" y="170" width="130" height="44" rx="5" fill="#fdf2f2" stroke="#d73a49"/>
<text x="85.0" y="189.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Device memory</text>
<text x="85.0" y="203.0" font-size="10" text-anchor="middle" fill="#1b1f24">the bytes (mapped)</text>
<line x1="85" y1="170" x2="85" y2="154" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="190" y="110" width="130" height="44" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="255.0" y="129.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Shader module</text>
<text x="255.0" y="143.0" font-size="10" text-anchor="middle" fill="#1b1f24">your SPIR-V</text>
<rect x="190" y="170" width="130" height="44" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="255.0" y="189.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Set layout +</text>
<text x="255.0" y="203.0" font-size="10" text-anchor="middle" fill="#1b1f24">pipeline layout</text>
<rect x="350" y="140" width="130" height="44" rx="5" fill="#e6f4ea" stroke="#1a7f37"/>
<text x="415.0" y="159.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Compute pipeline</text>
<text x="415.0" y="173.0" font-size="10" text-anchor="middle" fill="#1b1f24">the prepared kernel</text>
<line x1="320" y1="132" x2="350" y2="155" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="320" y1="192" x2="350" y2="172" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="20" y="246" font-size="11" fill="#586069">Made once per kernel / once per buffer</text>
<rect x="520" y="110" width="160" height="44" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="600.0" y="129.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Descriptor set</text>
<text x="600.0" y="143.0" font-size="10" text-anchor="middle" fill="#1b1f24">binding i = i-th buffer</text>
<rect x="520" y="170" width="160" height="44" rx="5" fill="#eef5fc" stroke="#0b5cad"/>
<text x="600.0" y="189.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">Command buffer</text>
<text x="600.0" y="203.0" font-size="10" text-anchor="middle" fill="#1b1f24">bind, push, dispatch</text>
<line x1="600" y1="154" x2="600" y2="170" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="232" width="160" height="40" rx="5" fill="#fff8e6" stroke="#9a6700"/>
<text x="600.0" y="256.0" font-size="10" text-anchor="middle" font-weight="700" fill="#1b1f24">vkQueueSubmit, then wait</text>
<line x1="600" y1="214" x2="600" y2="232" stroke="#586069" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="345" y="236" font-size="11" fill="#586069">Made again for every launch</text>
<text x="345" y="252" font-size="11" fill="#586069">in polyir (an engine reuses them)</text>
<text x="20" y="288" font-size="11" fill="#586069">Metal needs far fewer objects: device, library/pipeline, buffers, one queue, and a command buffer with an encoder per launch.</text>
</svg>