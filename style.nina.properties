# C++ style for the C++ of this repository (core, runtime, targets), and the style of every `.poly` file — nina's docs/style.md "C++ rules". Check with
# `../nina/ninastyle/build/ninastyle core runtime targets` (from this checkout);
# `style.severity.cpp.<rule> = error` makes a rule fail the run.
#
# The conventions: PascalCase types and file names, camelCase functions, variables and
# members, `kPascal` or UPPER constants, lowercase namespaces; a class's non-public data
# members end in `_`, file-level globals are `g_camel`; public members come before protected
# and private ones. Functions stay simple: at most 16 code lines between the braces
# (`cpp.max_function_lines`; a warning, so existing long functions are a backlog, not a failure).
# A record holds only fields (`cpp.fields_only`): every behaviour is a free function taking the record first.
root = true

[*.{cpp,hpp,h,cc}]
cpp.access_order = public_first
cpp.filename_case = pascal
cpp.type_case = pascal
cpp.function_case = camel
# A function any file can call (everything a header declares, and its definition) is PascalCase: `CompileProgram`; one
# a file keeps to itself (an anonymous namespace or `static`) is camelCase: `nextToken`.
cpp.exported_function_case = pascal
cpp.internal_function_case = camel
cpp.parameter_case = camel
cpp.variable_case = camel|g_camel
cpp.member_case = camel
cpp.private_member_suffix = _
cpp.constant_case = k_pascal|upper_snake
cpp.enum_constant_case = upper_snake|pascal
cpp.namespace_case = snake
cpp.max_function_lines = 16
cpp.fields_only = on
trim_trailing_whitespace = true
insert_final_newline = true

# The program entry point is `main.cpp` everywhere.
[main.cpp]
cpp.filename_case = camel

# No fully qualified names: a name is introduced once by a `using` declaration (or an alias) and
# written short everywhere. `using` is the mechanism, so `no_using` stays off.
[*.{cpp,cc,hpp,h,hh}]
cpp.no_namespace_prefix = on
cpp.no_using = off

# Two-space indentation. Access labels (public/protected/private) sit one level inside their
# class and the members after them one level further; `case` labels likewise inside their switch.
[*.{cpp,cc,hpp,h,hh}]
indent_style = space
indent_size = 2
cpp.indent_labels = on
# A namespace or extern "C" body sits one level inside its `{`.
cpp.indent_namespaces = on
# A function body sits on lines of its own, and blank lines set each definition apart from the code around it.
cpp.expand_function_bodies = on
cpp.blank_lines_around_functions = on

# Code reads as short paragraphs with its key steps set apart (nina's docs/style.md "Reading rules").
[*.{cpp,cc,hpp,h,hh}]
# A body without braces is one edit away from a bug, and a braced body reads as a step of its own.
cpp.braces_on_control = on
# An `if` chain, a loop and a `switch` are the key steps of a function, so a blank line sets each apart.
cpp.blank_lines_around_control = on
# The result of a function stands on its own.
cpp.blank_line_before_final_return = on
# A blank line marks a new paragraph; padding after `{` or before `}` marks nothing.
cpp.no_blank_line_padding = on
# A reader finds the data first, then the interface, then the inline details.
cpp.header_layout = on
# A blank line marks where one declaration ends and the next begins.
cpp.blank_lines_around_declarations = on
# About 4 ± 1 chunks fit in working memory, so a paragraph of code holds at most 5 statements.
cpp.max_paragraph_statements = 5
# A function comment leads with one summary sentence and adds at most three lines of detail.
cpp.max_function_comment_lines = 4
# Understanding drops as sentences grow: about 90% at 14 words, under 10% past 40.
cpp.max_comment_sentence_words = 25
# A semicolon that is an empty statement does nothing and only makes the reader stop.
cpp.no_stray_semicolons = on

# The C ABI (polyir.h and CApi.cpp) is snake_case on purpose: its callers are other languages. The header keeps its lowercase name.
[core/include/polyir/polyir.h]
cpp.filename_case = snake
cpp.function_case = snake
cpp.exported_function_case = snake
cpp.parameter_case = snake|camel

[core/src/capi/CApi.cpp]
cpp.function_case = snake|camel
cpp.exported_function_case = snake|pascal
cpp.parameter_case = snake|camel

# The kernel part of the C ABI (polyir_kernels.h and KernelCApi.cpp, in libpolyir-lang-targets) is snake_case like polyir.h.
[targets/include/polyir/polyir_kernels.h]
cpp.filename_case = snake
cpp.function_case = snake
cpp.exported_function_case = snake
cpp.parameter_case = snake|camel

[targets/gpu/KernelCApi.cpp]
cpp.function_case = snake|camel
cpp.exported_function_case = snake|pascal
cpp.parameter_case = snake|camel

# The native GC runtime (Collector.c) is C, compiled to LLVM IR and embedded in every native program. It follows the
# same function rules as the C++: short functions, camelCase `static` helpers. Its `gc_*` entry points are called by
# name from generated IR and C, so the exported functions (non-`static`) stay snake_case like the C ABI.
[core/src/emit/llvm/runtime/Collector.c]
cpp.filename_case = pascal
cpp.type_case = pascal
cpp.function_case = camel
cpp.exported_function_case = snake
cpp.internal_function_case = camel
cpp.parameter_case = camel
cpp.variable_case = camel|g_camel
cpp.member_case = camel
cpp.constant_case = k_pascal|upper_snake
cpp.enum_constant_case = upper_snake|pascal
cpp.max_function_lines = 16
cpp.fields_only = on
cpp.indent_labels = on
cpp.expand_function_bodies = on
cpp.blank_lines_around_functions = on
# The reading rules of the C++ sections above, one key each, for the reasons given there.
cpp.braces_on_control = on
cpp.blank_lines_around_control = on
cpp.blank_line_before_final_return = on
cpp.no_blank_line_padding = on
cpp.header_layout = on
cpp.blank_lines_around_declarations = on
cpp.max_paragraph_statements = 5
cpp.max_function_comment_lines = 4
cpp.max_comment_sentence_words = 25
cpp.no_stray_semicolons = on
indent_style = space
indent_size = 2
trim_trailing_whitespace = true
insert_final_newline = true

# `.poly` is polyir's own language (its own grammar, no Nina or C++
# syntax tree), so only the text-level EditorConfig keys and the
# `polyir.*` rules below apply to it. The 2-space indent matches the
# C++ sections above, for consistency across the whole project.
[*.poly]
indent_style = space
indent_size = 2
# `label name(params):` reads like a case label: level with the `func` that holds it, outdented from the body.
polyir.label_indent = outdent
# Kotlin-style construction, the same bar as the Nina code: `Point(x: 1, y: 2)`, not `Point { x: 1, y: 2 }`; a struct
# with no `var` field lists its fields in parentheses, `struct Point(x: f64, y: f64)`, methods staying in the body.
polyir.prefer_constructor_call = true
polyir.prefer_paren_struct = true
end_of_line = lf
trim_trailing_whitespace = true
insert_final_newline = true
charset = utf-8
max_line_length = 120
style.severity = warn
